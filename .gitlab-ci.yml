stages:
  - install
  - build
  - test
  - lint
  - sonarqube-check

default:
  image: node:22-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - .turbo/

# ------------------------------------------------------------
# install — Hanya untuk mengisi cache, tidak upload artifacts
# ------------------------------------------------------------
install:
  stage: install
  script:
    - pnpm install --frozen-lockfile
  # ARTIFACTS DIHAPUS DARI SINI

# ------------------------------------------------------------
# build
# ------------------------------------------------------------
build:
  stage: build
  needs: [install]
  script:
    - pnpm install --frozen-lockfile # Sangat cepat karena cache
    - pnpm turbo run build --filter=backend
  artifacts:
    paths:
      - apps/backend/dist/ # Hanya upload folder dist yang ukurannya kecil
    expire_in: 1 day

# ------------------------------------------------------------
# test
# ------------------------------------------------------------
test:
  stage: test
  needs: [install]
  script:
    - pnpm install --frozen-lockfile
    - pnpm turbo run test --filter=backend
  allow_failure: true
  artifacts:
    when: always
    paths:
      - apps/backend/coverage/
    expire_in: 1 week

# ------------------------------------------------------------
# lint
# ------------------------------------------------------------
lint:
  stage: lint
  needs: [install]
  script:
    - pnpm install --frozen-lockfile
    - pnpm turbo run lint --filter=backend
  allow_failure: true

# ------------------------------------------------------------
# sonarqube-check
# ------------------------------------------------------------
sonarqube-check:
  stage: sonarqube-check
  needs: [build]
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  rules:
    - if: $SONAR_TOKEN
      when: always
    - when: never