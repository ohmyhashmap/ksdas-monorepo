# ============================================================
# GitLab CI/CD — KSDAS Monorepo
# ============================================================
# Runner: GitLab Runner dengan Podman executor (limit = 1)
# Image: node:22-slim (dipull dari Docker Hub saat job pertama)
# ============================================================

stages:
  - install
  - build
  - test
  - lint
  - sonarqube-check

default:
  image: node:22-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - .turbo/

# ------------------------------------------------------------
# install — pnpm install dengan cache
# ------------------------------------------------------------
install:
  stage: install
  script:
    - pnpm install --frozen-lockfile
  artifacts:
    paths:
      - node_modules/
      - apps/backend/node_modules/
    expire_in: 1 hour

# ------------------------------------------------------------
# build — turbo run build (filter backend)
# ------------------------------------------------------------
build:
  stage: build
  needs: [install]
  script:
    - pnpm turbo run build --filter=backend
  artifacts:
    paths:
      - apps/backend/dist/
    expire_in: 1 day

# ------------------------------------------------------------
# test — jest (allow_failure sampai test stabil)
# ------------------------------------------------------------
test:
  stage: test
  needs: [install]
  script:
    - pnpm turbo run test --filter=backend
  allow_failure: true
  artifacts:
    when: always
    paths:
      - apps/backend/coverage/
    expire_in: 1 week

# ------------------------------------------------------------
# lint — oxlint
# ------------------------------------------------------------
lint:
  stage: lint
  needs: [install]
  script:
    - pnpm turbo run lint --filter=backend
  allow_failure: true

# ------------------------------------------------------------
# sonarqube-check — hanya jalan kalau SONAR_TOKEN di-set
# ------------------------------------------------------------
sonarqube-check:
  stage: sonarqube-check
  needs: [build]
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  rules:
    - if: $SONAR_TOKEN
      when: always
    - when: never