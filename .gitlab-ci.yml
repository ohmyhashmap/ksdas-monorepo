stages:
  - install
  - build
  - test
  - lint
  - sonarqube-check

# ------------------------------------------------------------
# GitLab SAST (Static Application Security Testing)
# ------------------------------------------------------------
include:
  - template: Security/SAST.gitlab-ci.yml

default:
  image: node:22-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - .turbo/

# ------------------------------------------------------------
# install
# ------------------------------------------------------------
install:
  stage: install
  script:
    - pnpm install --frozen-lockfile

# ------------------------------------------------------------
# build
# ------------------------------------------------------------
build:
  stage: build
  needs: [install]
  script:
    - pnpm install --frozen-lockfile
    - pnpm turbo run build --filter=backend
  artifacts:
    paths:
      - apps/backend/dist/
    expire_in: 1 day

# ------------------------------------------------------------
# test
# ------------------------------------------------------------
test:
  stage: test
  needs: [install]
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter backend test:cov
  allow_failure: true
  artifacts:
    when: always
    paths:
      - apps/backend/coverage/
    expire_in: 1 week

# ------------------------------------------------------------
# lint (Menggunakan oxlint dengan format Code Quality GitLab)
# ------------------------------------------------------------
lint:
  stage: lint
  needs: [install]
  script:
    - pnpm install --frozen-lockfile
    - cd apps/backend && pnpm exec oxlint --format=gitlab > gl-code-quality-report.json || true
  artifacts:
    reports:
      codequality: apps/backend/gl-code-quality-report.json
  allow_failure: true

# ------------------------------------------------------------
# sonarqube-check (Akan otomatis di-skip jika SONAR_TOKEN kosong)
# ------------------------------------------------------------
sonarqube-check:
  stage: sonarqube-check
  needs: [build]
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  rules:
    - if: $SONAR_TOKEN
      when: always
    - when: never

# ------------------------------------------------------------
# Override untuk GitLab SAST agar tidak menjalankan before_script global
# (Karena image Semgrep tidak memiliki corepack/Node.js)
# ------------------------------------------------------------
semgrep-sast:
  before_script: []