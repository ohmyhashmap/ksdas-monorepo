stages:
  - build
  - test
  - performance-test
  - lint
  - sonarqube-check
  - deploy

include:
  - template: Security/SAST.gitlab-ci.yml

default:
  image: node:22-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - .turbo/

# ------------------------------------------------------------
# BUILD
# ------------------------------------------------------------
build:
  stage: build
  script:
    - pnpm install --frozen-lockfile
    - pnpm turbo run build --filter=backend
  artifacts:
    paths:
      - apps/backend/dist/
    expire_in: 1 day

# ------------------------------------------------------------
# TEST
# ------------------------------------------------------------
test:
  stage: test
  needs: [build]
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter backend test:cov
  allow_failure: true
  artifacts:
    when: always
    paths:
      - apps/backend/coverage/
    expire_in: 1 week

# ------------------------------------------------------------
# PERFORMANCE TEST (k6)
# ------------------------------------------------------------
# 1. Smoke Test: Berjalan otomatis setiap push (Sangat ringan)
k6-performance-test:
  stage: performance-test
  image: 
    name: grafana/k6:latest
    entrypoint: [""]
  before_script: [] 
  script:
    - k6 run --summary-export=k6-summary.json apps/backend/test/performance/smoke-test.js
  allow_failure: true 
  artifacts:
    when: always
    paths:
      - k6-summary.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

