stages:
  - install
  - build
  - test
  - performance-test
  - lint
  - sonarqube-check

# ------------------------------------------------------------
# GitLab SAST
# ------------------------------------------------------------
include:
  - template: Security/SAST.gitlab-ci.yml

default:
  image: node:22-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - .turbo/

# ------------------------------------------------------------
# install
# ------------------------------------------------------------
install:
  stage: install
  script:
    - pnpm install --frozen-lockfile

# ------------------------------------------------------------
# build
# ------------------------------------------------------------
build:
  stage: build
  needs: [install]
  script:
    - pnpm install --frozen-lockfile
    - pnpm turbo run build --filter=backend
  artifacts:
    paths:
      - apps/backend/dist/
    expire_in: 1 day

# ------------------------------------------------------------
# test
# ------------------------------------------------------------
test:
  stage: test
  needs: [install]
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter backend test:cov
  allow_failure: true
  artifacts:
    when: always
    paths:
      - apps/backend/coverage/ # Laporan coverage ini yang akan dibaca SonarQube
    expire_in: 1 week

# ------------------------------------------------------------
# k6 Performance Test
# ------------------------------------------------------------
k6-performance-test:
  stage: performance-test
  image: 
    name: grafana/k6:latest
    entrypoint: [""]
  script:
    - k6 run --summary-export=k6-summary.json apps/backend/tests/performance/smoke-test.js
  allow_failure: true # <--- TAMBAHKAN INI (Agar tidak menggagalkan pipeline jika backend belum nyala)
  artifacts:
    when: always
    paths:
      - k6-summary.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ------------------------------------------------------------
# lint
# ------------------------------------------------------------
lint:
  stage: lint
  needs: [install]
  script:
    - pnpm install --frozen-lockfile
    - cd apps/backend && pnpm exec oxlint --format=gitlab > gl-code-quality-report.json || true
  artifacts:
    reports:
      codequality: apps/backend/gl-code-quality-report.json
  allow_failure: true

# ------------------------------------------------------------
# sonarqube-check
# ------------------------------------------------------------
sonarqube-check:
  stage: sonarqube-check
  # <--- UBAH DISINI: Butuh 'test' agar bisa mengambil file coverage
  needs: [build, test] 
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  script:
    - sonar-scanner
  allow_failure: true
  rules:
    - if: $SONAR_TOKEN
      when: always
    - when: never

# ------------------------------------------------------------
# Override untuk GitLab SAST
# ------------------------------------------------------------
semgrep-sast:
  before_script: []