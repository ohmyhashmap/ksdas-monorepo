stages:
  - build
  - test
  - performance-test
  - lint
  - sonarqube-check
  - deploy

include:
  - template: Security/SAST.gitlab-ci.yml

default:
  image: node:22-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - .turbo/

# ------------------------------------------------------------
# BUILD (Backend & Frontend)
# ------------------------------------------------------------
build:
  stage: build
  script:
    - pnpm install --frozen-lockfile
    # Membangun semua aplikasi di dalam folder apps/
    - pnpm turbo run build 
  artifacts:
    paths:
      - apps/backend/dist/
      - apps/frontend/dist/
    expire_in: 1 day

# ------------------------------------------------------------
# TEST (Backend)
# ------------------------------------------------------------
test:
  stage: test
  needs: [build]
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter backend test:cov
  allow_failure: true
  artifacts:
    when: always
    paths:
      - apps/backend/coverage/
    expire_in: 1 week

# ------------------------------------------------------------
# PERFORMANCE TEST (k6)
# ------------------------------------------------------------
k6-performance-test:
  stage: performance-test
  image: 
    name: grafana/k6:latest
    entrypoint: [""]
  before_script: [] 
  script:
    - k6 run --summary-export=k6-summary.json apps/backend/test/performance/smoke-test.js
  allow_failure: true 
  artifacts:
    when: always
    paths:
      - k6-summary.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

# ------------------------------------------------------------
# LINT (Backend & Frontend)
# ------------------------------------------------------------
lint:
  stage: lint
  needs: [build]
  script:
    - pnpm install --frozen-lockfile
    # Lint Backend
    - cd apps/backend && pnpm exec oxlint --format=gitlab > gl-code-quality-report.json || true
    # Lint Frontend
    - cd ../frontend && pnpm exec oxlint --format=gitlab > ../backend/gl-code-quality-report-frontend.json || true
  artifacts:
    reports:
      codequality: apps/backend/gl-code-quality-report.json 
  allow_failure: true

# ------------------------------------------------------------
# SONARQUBE
# ------------------------------------------------------------
sonarqube-check:
  stage: sonarqube-check
  needs: [build, test]
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  before_script: []
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  script:
    - cd apps/backend
    - sonar-scanner
  allow_failure: true 
  rules:
    - if: $SONAR_TOKEN
      when: always
    - when: never

# ------------------------------------------------------------
# OVERRIDE SAST
# ------------------------------------------------------------
semgrep-sast:
  before_script: []

# ------------------------------------------------------------
# DEPLOY (Backend ke Systemd, Frontend ke Nginx)
# ------------------------------------------------------------
deploy:
  stage: deploy
  image: alpine:latest
  needs: [build, test]
  before_script:
    - apk add --no-cache openssh-client rsync
    - eval $(ssh-agent -s)
    - mkdir -p ~/.ssh
    - chmod 700 ~/.ssh
    
    # --- KUNCI PERBAIKAN: Bersihkan \r dan tulis ulang file kunci ---
    # Perintah ini membaca file dari GitLab, membuang karakter Windows (\r),
    # lalu menyimpannya ke folder ~/.ssh/id_ed25519
    - tr -d '\r' < "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-add ~/.ssh/id_ed25519
    # -----------------------------------------------------------------
    
    - ssh-keyscan -H 192.168.100.42 >> ~/.ssh/known_hosts
    - chmod 644 ~/.ssh/known_hosts
  script:
    # 1. Generate file .env otomatis dari GitLab Variables
    - |
      cat <<EOF > .env
      DB_HOST=$DB_HOST
      DB_PORT=$DB_PORT
      DB_USER=$DB_USER
      DB_PASS=$DB_PASS
      DB_NAME=$DB_NAME
      JWT_SECRET=$JWT_SECRET
      JWT_EXPIRES_IN=$JWT_EXPIRES_IN
      EOF
      
    # --- DEPLOY BACKEND ---
    - echo "Deploying Backend..."
    - ssh christian@192.168.100.42 "mkdir -p /var/lib/ksdas-backend/apps/backend"
    - rsync -avz --exclude='node_modules' --exclude='src' --exclude='test' --exclude='.turbo' apps/backend/ christian@192.168.100.42:/var/lib/ksdas-backend/apps/backend/
    - rsync -avz package.json pnpm-lock.yaml pnpm-workspace.yaml christian@192.168.100.42:/var/lib/ksdas-backend/
    - rsync -avz .env christian@192.168.100.42:/var/lib/ksdas-backend/.env
    - ssh christian@192.168.100.42 "cd /var/lib/ksdas-backend && corepack pnpm install --prod --frozen-lockfile && sudo systemctl restart ksdas-backend"

    # --- DEPLOY FRONTEND ---
    - echo "Deploying Frontend..."
    - ssh christian@192.168.100.42 "mkdir -p /var/www/ksdas-frontend"
    # Flag --delete akan menghapus file lama di server jika tidak ada di hasil build baru
    - rsync -avz --delete apps/frontend/dist/ christian@192.168.100.42:/var/www/ksdas-frontend/
    
  rules:
    - if: $CI_COMMIT_BRANCH == "main"