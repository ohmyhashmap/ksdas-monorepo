stages:
  - build
  - test
  - performance-test
  - lint
  - sonarqube-check

include:
  - template: Security/SAST.gitlab-ci.yml

default:
  image: node:22-slim
  before_script:
    - corepack enable
    - corepack prepare pnpm@latest --activate
    - pnpm config set store-dir .pnpm-store
  cache:
    key:
      files:
        - pnpm-lock.yaml
    paths:
      - .pnpm-store/
      - .turbo/

build:
  stage: build
  script:
    - pnpm install --frozen-lockfile
    - pnpm turbo run build --filter=backend
  artifacts:
    paths:
      - apps/backend/dist/
    expire_in: 1 day

test:
  stage: test
  needs: [build]
  script:
    - pnpm install --frozen-lockfile
    - pnpm --filter backend test:cov
  allow_failure: true
  artifacts:
    when: always
    paths:
      - apps/backend/coverage/
    expire_in: 1 week

k6-performance-test:
  stage: performance-test
  image: 
    name: grafana/k6:latest
    entrypoint: [""]
  before_script: [] 
  script:
    # Path diperbaiki: 'test' bukan 'tests'
    - k6 run --summary-export=k6-summary.json apps/backend/test/performance/smoke-test.js
  allow_failure: true 
  artifacts:
    when: always
    paths:
      - k6-summary.json
    expire_in: 1 week
  rules:
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"

lint:
  stage: lint
  needs: [build]
  script:
    - pnpm install --frozen-lockfile
    - cd apps/backend && pnpm exec oxlint --format=gitlab > gl-code-quality-report.json || true
  artifacts:
    reports:
      codequality: apps/backend/gl-code-quality-report.json
  allow_failure: true

sonarqube-check:
  stage: sonarqube-check
  needs: [build, test]
  image:
    name: sonarsource/sonar-scanner-cli:latest
    entrypoint: [""]
  before_script: []
  variables:
    SONAR_USER_HOME: "${CI_PROJECT_DIR}/.sonar"
    GIT_DEPTH: "0"
  cache:
    key: sonar-cache
    paths:
      - .sonar/cache
  script:
    - cd apps/backend
    - sonar-scanner
  allow_failure: true 
  rules:
    - if: $SONAR_TOKEN
      when: always
    - when: never

semgrep-sast:
  before_script: []