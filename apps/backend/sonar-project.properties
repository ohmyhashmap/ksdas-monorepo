sonar.projectKey=ksdas-monorepo
sonar.projectName=KSDAS Monorepo
sonar.projectVersion=1.0.0

sonar.sources=src
sonar.tests=test
sonar.exclusions=**/*.spec.ts,**/*.e2e-spec.ts,**/node_modules/**,dist/**,coverage/**
sonar.test.inclusions=**/*.spec.ts,**/*.e2e-spec.ts

# Mengambil laporan coverage dari hasil test:cov
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.lcov.reportPaths=coverage/lcov.info

sonar.sourceEncoding=UTF-8