version: '3.8'
services:
  postgres:
    image: postgres:15-alpine
    container_name: ksdas_postgres
    environment:
      POSTGRES_USER: ksdas
      POSTGRES_PASSWORD: ksdas_password
      POSTGRES_DB: document_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: ksdas_redis
    ports:
      - "6379:6379"

  minio:
    image: pgsty/silo:latest
    container_name: ksdas_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata: